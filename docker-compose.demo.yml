# Vault + real ssf-trust-receiver (SSE) + ssf-relay inbound loop.
#
# Requires ssf-trust-receiver cloned alongside this repo:
#   ../ssf-trust-receiver
#
# Or set TRUST_RECEIVER_IMAGE to a pre-built image (see demo/PIN.md).

services:
  vault:
    image: hashicorp/vault:1.18
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 3s
      timeout: 2s
      retries: 10

  trust-receiver:
    image: ${TRUST_RECEIVER_IMAGE:-ssf-trust-receiver:demo-local}
    build:
      context: ${TRUST_RECEIVER_CONTEXT:-../ssf-trust-receiver}
      dockerfile: Dockerfile
      target: ssf-trust-receiver
    volumes:
      - ./demo/trust-receiver.yaml:/etc/trust-receiver/config.yaml:ro
    ports:
      - "9090:9090"

  ssf-relay:
    image: ssf-relay:demo-local
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/usr/local/bin/ssf-relay", "/etc/ssf-relay/config.yaml"]
    volumes:
      - ./ssf-relay.demo.yaml:/etc/ssf-relay/config.yaml:ro
    environment:
      VAULT_TOKEN: root
    depends_on:
      vault:
        condition: service_healthy
      trust-receiver:
        condition: service_started
