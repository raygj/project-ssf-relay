name: Release demo bundle

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  demo-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build demo bundle
        run: |
          chmod +x scripts/build-demo-bundle.sh scripts/demo-trigger.sh scripts/demo-bundle-up.sh
          ./scripts/build-demo-bundle.sh "${GITHUB_REF_NAME}"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/demo-bundle-${{ github.ref_name }}.tar.gz
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
